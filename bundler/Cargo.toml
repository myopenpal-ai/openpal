[package]
name = "openpal-bundler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenPal bundling & deployment module: stages the llama.cpp engine, generates icons, builds, signs and notarizes the macOS app. Completely separate from the GUI and core logic."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
image = "0.25"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
toml = "1"
