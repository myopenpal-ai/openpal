# PR-gating checks: Rust lint/test across the whole workspace, and the
# frontend's typecheck + unit tests + fast mocked-IPC e2e tier. Kept separate
# from portable.yml, which builds release artifacts and never runs tests.
#
# Heavier/narrower checks live in their own path-filtered workflows so they
# don't slow down every PR: plugin-tests.yml (Python plugin suites),
# engine-e2e.yml (the real llama-server engine test, only when the engine's
# own code changes) and notify-platforms.yml (the notification backends on
# macOS, Windows and Android, which this Linux-only workflow never compiles).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust gate used to be one serial job (fmt, clippy, then the three
  # per-crate test runs) — a ~31m cold path paid one step at a time on a
  # single runner. Its two big costs, clippy's whole-workspace *check*
  # compile and the tests' whole-workspace *build* compile, are disjoint
  # artifact sets, and the three crates' test builds only waited on each
  # other because they shared the same disk. It's now split: rust-clippy (fmt
  # + whole-workspace clippy) and a rust-test matrix that runs each crate's
  # `cargo test` on its own runner. Same commands, same assertions, same
  # checks — just overlapping instead of queuing. Each job owns a rust-cache
  # key, so a warm PR restores only what each job needs (the app job's cache
  # carries core's artifacts too, so a normal PR doesn't re-pay core's
  # compile). `rust-test` keeps fail-fast off so one crate's failure can't
  # hide another's results.
  rust-clippy:
    name: rust-clippy (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      # A hosted runner has roughly 14 GB free and this workspace's debug
      # `target/` is about 12 GB after clippy and the test builds (Tauri +
      # WebKitGTK + the notification stack + the prompt-injection classifier's
      # tract runtime), so the app crate's test link step
      # died with `ld terminated with signal 7 [Bus error]` once the disk ran
      # out. The preinstalled .NET, Haskell, Android and CodeQL toolchains take
      # several GB and nothing here uses them; the `df` lines show what was gained.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-clippy

      # crates/app links against Tauri/WebKitGTK and cpal (ALSA) even to
      # compile — mirrors portable.yml's Linux dependency list.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            build-essential

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (whole workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: rust-test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    # One job per crate, all started in parallel. fail-fast off, so a failure
    # in one crate's tests can't cancel the other two crates' results (the
    # same isolation the old three serial steps gave us).
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: openpal-core
            cache-key: ci-test-core
          - crate: openpal-app
            cache-key: ci-test-app
          - crate: openpal-bundler
            cache-key: ci-test-bundler
    steps:
      # Same disk-pressure context as rust-clippy: each job's debug `target/`
      # is a multi-GB slice (the test builds), which is what originally forced
      # the free-disk step.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache-key }}

      # Same system deps as ever — the crates build in one workspace and can
      # pull GUI/audio dependencies transitively even when compiling tests.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            build-essential

      - name: cargo test
        run: cargo test -p ${{ matrix.crate }}

  frontend:
    name: frontend (typecheck, unit, mocked e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck + production build
        working-directory: ui
        run: npm run build

      # jsx-a11y rules are warn-only for now (see ui/eslint.config.js) while
      # the accessibility remediation backlog in docs/design/ACCESSIBILITY_AUDIT.md
      # is worked through — this step can't fail the job yet.
      - name: Lint (ESLint)
        working-directory: ui
        run: npm run lint

      - name: Unit tests (Vitest)
        working-directory: ui
        run: npm test

      # Chromium only — this tier drives the Vite dev server with the Tauri
      # IPC layer mocked, never a real webview, so one browser is enough.
      # Keep the downloaded browser between runs so a warm PR doesn't re-fetch
      # it; `playwright install` still verifies and installs system deps (and
      # a newer browser once one is released).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}
      - name: Install Playwright's Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Mocked-IPC e2e (Playwright)
        working-directory: ui
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
