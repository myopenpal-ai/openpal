# Manual-only workflow covering the two remaining hand-steps in the update-
# feed pipeline (the "still done by hand" half of docs/RELEASING.md): turning
# a smoke-passed stable draft into the live app feed, and refreshing/boot-
# strapping the rolling `engine-latest` engine feed. Deliberately triggered
# ONLY by `workflow_dispatch` — no schedule, no push, no pull_request/merge_
# group — so it is never part of any automated path, can't fire on its own,
# and stays a deliberate human action (the soft-launch gate in
# docs/SECURITY_POSTURE.md). Both jobs are optional and independent, chosen
# per run via the dispatch inputs:
#
# 1. `promote` (when `promote_tag` is set) — promote one draft stable `v*`
#    release, the only step that makes /releases/latest/download/latest.json
#    resolve (drafts and `b*` pre-releases are invisible to /releases/latest),
#    then verify both configured feeds resolve. Rejects non-`v*` tags and
#    pre-releases, treats an already-published tag as a no-op.
#
# 2. `engine` (when `engine_refresh` is enabled) — the engine-feed bootstrap/
#    refresh that engine-update.yml runs on the schedule: `fetch-engine` +
#    `engine-manifest` per target on one ubuntu-latest job (one sequential
#    loop, because engine-manifest fetch-and-merges the whole manifest file —
#    concurrent legs would race and drop each other's entries), creating the
#    non-draft `engine-latest` release on the first run. Same signing env
#    (production-release), same runner-availability target default as
#    engine-update.yml, with `engine_targets` / `engine_tag` inputs to point
#    the manual run anywhere (e.g. a one-off macos-arm64 bootstrap before a
#    runner is registered). `fetch-engine` only smoke-tests native targets;
#    that is the accepted trade-off of one runner handling every target.
name: publish-update-feeds

on:
  workflow_dispatch:
    inputs:
      promote_tag:
        description: "Stable v* draft to make live, e.g. v0.5.3 (blank = skip). This is what makes /releases/latest/download/latest.json resolve. b* and other pre-releases are rejected — /releases/latest never resolves to them."
        type: string
        required: false
        default: ""
      engine_refresh:
        description: "Also refresh the engine-latest feed (fetch-engine + engine-manifest per target)."
        type: boolean
        required: false
        default: false
      engine_targets:
        description: "Comma-separated targets for the engine refresh; blank = the default set (same as engine-update.yml: all five targets, macos-arm64 included)."
        type: string
        required: false
        default: ""
      engine_tag:
        description: "llama.cpp tag to publish for the engine refresh (e.g. b10621); blank = resolve the current latest once."
        type: string
        required: false
        default: ""

# Manual runs serialize rather than cancel: an interrupted promote must not
# be silently superseded mid-`gh release edit`.
concurrency:
  group: publish-update-feeds
  cancel-in-progress: false

# Least privilege: read-only by default; each publishing job re-opens
# `contents: write` (+ `deployments: write` under the release environment)
# where publishing needs it (docs/SECURITY_POSTURE.md).
permissions:
  contents: read

env:
  # Authenticates `gh` / the bundler's GitHub API calls instead of the
  # anonymous rate limit shared runner IPs exhaust (HTTP 403).
  GH_TOKEN: ${{ github.token }}

jobs:
  # Cheap gate so a run with neither operation selected fails with guidance
  # instead of silently doing nothing.
  validate:
    name: validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one operation
        env:
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          ENGINE: ${{ inputs.engine_refresh }}
        run: |
          set -euo pipefail
          if [[ -z "$PROMOTE_TAG" && "$ENGINE" != "true" ]]; then
            echo "::error::Nothing selected — set promote_tag or enable engine_refresh."
            exit 1
          fi
          echo "At least one operation selected."

  # The promote step of docs/RELEASING.md, guarded: only a real v*, non-pre-
  # release draft is made live, and the run proves both feeds resolve before
  # it reports success (a dead feed is otherwise invisible — the update gate
  # fails open).
  promote:
    name: promote stable release + verify feeds
    needs: validate
    if: inputs.promote_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify the release is a promote-able draft
        env:
          TAG: ${{ inputs.promote_tag }}
        run: |
          set -euo pipefail

          if [[ "$TAG" != v* ]]; then
            echo "::error::promote_tag must be a v* stable tag, got \"$TAG\". b* nightlies are pre-releases; /releases/latest never resolves to them, so they cannot become the app feed."
            exit 1
          fi

          if ! gh release view "$TAG" --repo myopenpal-ai/openpal --json isDraft >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist (or this token cannot see it) — nothing to promote. Run the Make Release + portable pipeline first."
            exit 1
          fi

          is_draft="$(gh release view "$TAG" --repo myopenpal-ai/openpal --json isDraft -q '.isDraft')"
          is_prerelease="$(gh release view "$TAG" --repo myopenpal-ai/openpal --json isPrerelease -q '.isPrerelease')"

          if [[ "$is_prerelease" == "true" ]]; then
            echo "::error::refusing to promote $TAG: it is a pre-release — /releases/latest never resolves to pre-releases, so promoting it cannot make the app feed live."
            exit 1
          fi

          if [[ "$is_draft" == "false" ]]; then
            # Idempotent rerun: an already-public stable release is a no-op.
            echo "$TAG is already published (not a draft) — nothing to do."
          else
            echo "Promoting draft $TAG (gh release edit --draft=false)…"
            gh release edit "$TAG" --draft=false --repo myopenpal-ai/openpal
            echo "✓ $TAG promoted — /releases/latest now resolves to it."
          fi

      - name: Verify both update feeds resolve
        env:
          TAG: ${{ inputs.promote_tag }}
        run: |
          set -euo pipefail
          verify() { # $1 = feed name, $2 = URL
            if curl -fsSL --max-time 30 -A "openpal-feed-health" "$2" -o /dev/null; then
              echo "✓ $1 resolves: $2"
            else
              echo "::error::$1 does NOT resolve (after promoting $TAG): $2"
              echo "::error::docs/RELEASING.md — a dead feed is invisible to users (the update gate fails open), so fix it; this alarm is the only signal."
              return 1
            fi
          }
          failed=0
          verify "app feed" "https://github.com/myopenpal-ai/openpal/releases/latest/download/latest.json" || failed=1
          verify "engine feed" "https://github.com/myopenpal-ai/openpal/releases/download/engine-latest/engine-manifest.json" || failed=1
          exit "$failed"

      - name: Summary
        env:
          TAG: ${{ inputs.promote_tag }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✓ $TAG promoted

          \`$TAG\` is now the live \`/releases/latest\` app feed; both update feeds verified above.
          EOF

  # The engine-feed bootstrap/refresh from docs/RELEASING.md, on demand.
  # Mirrors engine-update.yml's publish job (same signing env + runner-
  # availability target default), but runs only when manually selected.
  engine:
    name: refresh engine feed
    needs: validate
    if: inputs.engine_refresh == true
    runs-on: ubuntu-latest
    # Release-signing runs target a protected environment so the signing
    # secrets are scoped to it (docs/SECURITY_POSTURE.md).
    environment: production-release
    permissions:
      contents: write
      deployments: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      # `master` pin + explicit `toolchain`, so neither half floats (issue #130;
      # see portable.yml's header note).
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-14
        with:
          toolchain: 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: publish-update-feeds-engine

      - name: Install npm dependencies (root — for the Tauri CLI signer)
        run: npm ci

      - name: Refuse to publish from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::engine refresh publishes the signed engine feed to the rolling engine-latest release — refusing to run from ${{ github.ref }}. Dispatch on main."
          exit 1

      - name: Resolve llama.cpp engine tag
        id: engine
        env:
          ENGINE_TAG_INPUT: ${{ inputs.engine_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$ENGINE_TAG_INPUT" ]]; then
            echo "tag=$ENGINE_TAG_INPUT" >> "$GITHUB_OUTPUT"
            echo "Publishing explicit engine tag: $ENGINE_TAG_INPUT"
          else
            tag="$(cargo run -p openpal-bundler -- resolve-engine-tag)"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Resolved engine tag: $tag"
          fi

      - name: Compute target list
        id: targets
        env:
          TARGETS_INPUT: ${{ inputs.engine_targets }}
          ENGINE_TARGETS: ${{ vars.ENGINE_TARGETS }}
        run: |
          set -euo pipefail

          known="macos-arm64 macos-x64 win-vulkan-x64 ubuntu-vulkan-x64 ubuntu-vulkan-arm64"

          if [[ -n "$TARGETS_INPUT" ]]; then
            raw="$TARGETS_INPUT"
            explicit=1
          else
            # Same default as engine-update.yml: the full five-target
            # inventory, macos-arm64 included. This loop runs on
            # ubuntu-latest, so no macOS runner is involved.
            raw="${ENGINE_TARGETS:-macos-arm64,macos-x64,win-vulkan-x64,ubuntu-vulkan-x64,ubuntu-vulkan-arm64}"
            explicit=0
          fi

          list=""
          IFS=,
          for t in $raw; do
            # Tolerate spaces/hanging commas in the input.
            t="${t//[[:space:]]/}"
            [ -n "$t" ] || continue
            case " $known " in
              *" $t "*) ;;
              *) echo "::error::unknown target \"$t\" — known targets: $known"; exit 1 ;;
            esac
            list="$list $t"
          done
          unset IFS
          list="${list# }"
          echo "targets=$list" >> "$GITHUB_OUTPUT"
          echo "Engine targets: $list"

          # Fail safe, not fail silent — but only for the implicit default;
          # an explicit engine_targets selection (e.g. a one-off macos-arm64
          # bootstrap) is the operator's call, not an omission.
          if [[ "$explicit" == "0" && "$list" != *macos-arm64* ]]; then
            echo "::warning::engine feed has no macos-arm64 — Apple Silicon installs keep their last published engine (ENGINE_TARGETS is overridden; set engine_targets to include it explicitly)"
          fi

      - name: Fetch and publish every target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          ENGINE_TAG: ${{ steps.engine.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for t in $TARGETS; do
            echo "::group::engine $t"
            echo "Fetching llama.cpp ${ENGINE_TAG} for ${t}…"
            cargo run -p openpal-bundler -- fetch-engine --tag "$ENGINE_TAG" --target "$t"
            echo "Packaging, signing and merging ${t} into engine-latest…"
            cargo run -p openpal-bundler -- engine-manifest --target "$t"
            echo "::endgroup::"
          done

      - name: Verify the engine feed resolves
        run: |
          set -euo pipefail
          url="https://github.com/myopenpal-ai/openpal/releases/download/engine-latest/engine-manifest.json"
          if curl -fsSL --max-time 30 -A "openpal-feed-health" "$url" -o /dev/null; then
            echo "✓ engine feed resolves: $url"
          else
            echo "::error::engine feed does NOT resolve after refresh: $url"
            exit 1
          fi

      - name: Summary
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          ENGINE_TAG: ${{ steps.engine.outputs.tag }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Engine feed refreshed (llama.cpp ${ENGINE_TAG})

          Targets published to \`engine-latest\`:
          $(for t in $TARGETS; do echo "  - \`$t\`"; done)
          EOF
