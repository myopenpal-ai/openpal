# PR-driven release gate (docs/RELEASING.md): every PR that changes
# user-facing code must bump the workspace version in the same PR
# (`node scripts/bump-version.mjs --bump patch|minor|major --notes "…"`), and
# CI enforces it here. The only thing this check does is compare the workspace
# version on the PR head against the merge-base — the author already decided
# the bucket, so there is no git-log Conventional-Commits guessing.
#
# It passes when only release-exempt paths changed (docs/, *.md, .github/,
# scripts/), or the PR opts out (`[no release]` in the title / `no-release`
# label), or the workspace version increased since the merge-base — with the
# `release: patch|minor|major` labels (applied by labeler.yml) the increase
# must match the declared bucket.
#
# When it would otherwise fail ONLY because the version never increased
# (check-version-bump.mjs exits 3 — user-facing code changed, no opt-out, no
# bump), CI fixes it itself on in-repo PR branches: it applies the exact
# rewrite `node scripts/bump-version.mjs --bump <bucket> --notes "…"` makes — a
# single commit on the PR head — and pushes it over HTTPS with the
# RELEASE_PUSH_TOKEN PAT, because only a non-GITHUB_TOKEN push re-triggers the
# PR's checks (the re-run then passes; the scheme is idempotent — one bump
# commit, then green). The push is not trusted on its own: the run waits for
# the re-triggered check to appear on the new head and fails red if it never
# does (issue #131). The bucket is the declared `release:` label when one is
# present, else the suggestion the check would print (the PR title's
# conventional type); the CHANGELOG.md line is the PR title. Forks and the
# merge-queue ref (gh-readonly-queue/…, which no one can push to) keep the old
# behaviour: the run fails naming the bump command and no push is attempted.
#
# This is a REQUIRED check on main and deliberately has NO workflow-level
# `paths` filter (a required check whose workflow is skipped stays "Expected"
# and blocks the merge queue) — the exempt-path logic lives in the job. It must
# also fire on `merge_group` or the queue stalls waiting for a check that never
# runs (AGENTS.md). On `merge_group` the check is always read-only: the bump
# already sits in the PR's history by the time it is queued, so that leg just
# verifies and passes.
name: version-bump

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read
  # The push below proves itself by finding the PR's re-triggered check run on
  # the new head commit; reading check runs needs this explicitly.
  checks: read

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: version-bump (release gate)
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — the release PAT is the only credential the
      # auto-bump push uses. actions/checkout v7 keeps its token in a separate
      # RUNNER_TEMP credentials file wired in through includeIf.gitdir: keys, so
      # scrubbing `http.https://github.com/.extraheader` from .git/config
      # stopped removing anything (issue #131): the push inherited
      # GITHUB_TOKEN's Authorization header and re-triggered nothing. The
      # repository is public, so the fetches below need no credential at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # On pull_request the PR's title/labels/base come straight from the
      # event. On merge_group they are not in the payload: the queue runs on a
      # throwaway gh-readonly-queue/{base}/pr-{number}-{sha} ref, so the PR
      # number is parsed out of the ref and title/labels are looked up with gh
      # (falling back to the squashed commit message when the ref has no PR
      # number). The check itself never needs the title except for the
      # `[no release]` opt-out and the suggested bucket.
      - name: Resolve PR context and merge-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pr_number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            pr_title=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
            base_ref=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          else
            ref="$GITHUB_REF"
            base_ref=${ref#refs/heads/gh-readonly-queue/}
            base_ref=${base_ref%%/*}
            pr_number=$(printf '%s' "$ref" | sed -nE 's#.*/pr-([0-9]+)-.*#\1#p')
            if [[ -n "$pr_number" ]]; then
              # A transient gh failure must not fail the gate — the commit
              # message carries the same title.
              pr_title=$(gh pr view "$pr_number" --json title --jq '.title' 2>/dev/null || git log -1 --pretty=%s)
            else
              # The queue's squashed commit message carries the PR title.
              pr_title=$(git log -1 --pretty=%s)
            fi
          fi

          # The `release:` labels feed the declared-bucket check, so they are
          # needed on pull_request and merge_group alike (gh pr view is
          # read-only and works for fork PRs). A lookup hiccup just falls back
          # to "no labels" — the version-delta half of the gate still runs.
          if [[ -n "${pr_number:-}" ]]; then
            pr_labels=$(gh pr view "$pr_number" --json labels --jq '.labels | map(.name) | join(" ")' 2>/dev/null || true)
          fi

          git fetch origin "$base_ref"
          base_sha=$(git merge-base "origin/$base_ref" HEAD)
          head_sha="$GITHUB_SHA"

          {
            echo "BASE_SHA=$base_sha"
            echo "HEAD_SHA=$head_sha"
            echo "PR_TITLE<<EOF"
            printf '%s\n' "${pr_title:-}"
            echo "EOF"
            echo "PR_LABELS<<EOF"
            printf '%s\n' "${pr_labels:-}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # The gate itself. Exit 0 = pass (green, nothing to do). A failure is
      # normally red with the bump command in the logs — except exit 3, which
      # means "would fail only because the version never increased", the one
      # case CI can fix. On `pull_request` this step then records the bump the
      # check chose (bucket + note) and reports green so the next step can
      # apply it; on `merge_group` the queue's throwaway ref cannot be pushed
      # to, so exit 3 must stay a plain red failure there.
      - name: Check the version bump
        id: check
        run: |
          set +e
          node scripts/check-version-bump.mjs --base "$BASE_SHA" --head "$HEAD_SHA" \
            --title "$PR_TITLE" --labels "$PR_LABELS" > /tmp/version-bump.log 2>&1
          code=$?
          set -e
          cat /tmp/version-bump.log
          if [[ "$code" -eq 3 && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            bucket=$(sed -n 's/^AUTO_BUMP_BUCKET=//p' /tmp/version-bump.log | tail -n 1)
            note=$(sed -n 's/^AUTO_BUMP_NOTE=//p' /tmp/version-bump.log | tail -n 1)
            {
              echo "bump_bucket=${bucket}"
              echo "bump_note<<NOTE_EOF"
              printf '%s\n' "$note"
              echo "NOTE_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      # Apply the automated bump. Runs only when the check said the failure is
      # auto-fixable (exit 3 on pull_request), and only for in-repo PR branches
      # — a fork's head lives on a repo CI has no access to. The pushed commit
      # re-triggers the PR's checks (PAT push, not GITHUB_TOKEN), so the next
      # run passes with the bump already in history. The step after this one
      # proves the re-trigger actually happened before the workflow goes green.
      - name: Apply the automated version bump to the PR head
        id: bump
        if: github.event_name == 'pull_request' && steps.check.outputs.bump_bucket != ''
        env:
          BUMP_BUCKET: ${{ steps.check.outputs.bump_bucket }}
          BUMP_NOTE: ${{ steps.check.outputs.bump_note }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          # Fork PRs: the head branch is not writable from here — keep today's
          # behaviour (the check already printed the bump command; no push).
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          if [[ "$head_repo" != "${{ github.repository }}" ]]; then
            echo "::error::fork PR — CI cannot push to the head branch; run the bump command from the check output"
            exit 1
          fi

          # The PAT that lets this push re-trigger the PR's workflows is an
          # operator step (docs/RELEASING.md); without it we must not push.
          if [[ -z "${RELEASE_PUSH_TOKEN:-}" ]]; then
            echo "::error::RELEASE_PUSH_TOKEN is not set — auto-bump aborted; run the bump command by hand (docs/RELEASING.md)"
            exit 1
          fi

          # The pull_request checkout sits on the ephemeral refs/pull/N/merge;
          # the bump must be a commit on the PR head's actual tip, from a clean
          # tree (bump-version.mjs refuses a dirty one by design).
          git fetch origin "$GITHUB_SHA"
          git switch --detach "$GITHUB_SHA"

          node scripts/bump-version.mjs --bump "$BUMP_BUCKET" --notes "$BUMP_NOTE"

          head_ref="${{ github.event.pull_request.head.ref }}"
          new_version=$(node -p 'require("fs").readFileSync("Cargo.toml","utf8").match(/^\[workspace\.package\]\s*\nversion = "([^"]+)"/m)[1]')
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(release): auto-bump workspace version to v${new_version}"

          # Prove the gate actually passes on the committed head before pushing
          # anywhere — a regression in the bump path fails loudly here, locally,
          # and leaves the PR untouched.
          new_sha=$(git rev-parse HEAD)
          node scripts/check-version-bump.mjs --base "$BASE_SHA" --head "$new_sha" \
            --title "$PR_TITLE" --labels "$PR_LABELS"

          # Belt and braces for the bug in #131: a push authenticated with
          # GITHUB_TOKEN succeeds and silently re-triggers nothing, so any
          # GitHub Authorization header still visible to git must fail the run
          # here instead of being pushed through. With
          # persist-credentials: false this finds nothing; it catches a future
          # checkout change (or a re-added credential).
          if git config --get-all 'http.https://github.com/.extraheader' >/dev/null 2>&1; then
            echo "::error::a GitHub Authorization header is configured in git config — the bump push would authenticate as GITHUB_TOKEN and re-trigger no checks"
            git config --show-origin --get-all 'http.https://github.com/.extraheader'
            exit 1
          fi
          git remote add bump-origin "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push bump-origin "HEAD:refs/heads/${head_ref}"
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🤖 CI bumped the workspace version on this PR

          The PR changed user-facing code without a version bump, so CI committed
          \`node scripts/bump-version.mjs --bump $BUMP_BUCKET --notes "…"\` to the PR
          head (one commit: Cargo.toml, Cargo.lock, the plugin manifests,
          CHANGELOG.md) and pushed it. The PR's checks re-run on the new head;
          this workflow fails red if they do not start (a GITHUB_TOKEN push
          starts no workflow, silently). Review the bump like any other commit —
          if the bucket is wrong, re-bump or fix the \`release:\` label.
          EOF

      # The pushed commit is only useful if GitHub actually re-ran the PR's
      # checks on it. A GITHUB_TOKEN push moves the branch and starts nothing,
      # and the run would otherwise finish green (issue #131). The re-run is
      # observable as this workflow's own check run on the new head commit, so
      # wait for it and fail red if it never appears.
      - name: Verify the bump commit re-triggered the PR's checks
        if: github.event_name == 'pull_request' && steps.check.outputs.bump_bucket != ''
        env:
          NEW_SHA: ${{ steps.bump.outputs.new_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The check run is named after this job's `name:` — its presence on
          # the new head is the signal that the pull_request workflow started.
          echo "waiting for the PR's checks to start on ${NEW_SHA} — up to 120s"
          for attempt in $(seq 1 24); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${NEW_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "version-bump (release gate)")] | length')"
            if [[ "$count" -gt 0 ]]; then
              echo "checks re-triggered on ${NEW_SHA} (${count} version-bump check run(s))"
              echo "::notice::the auto-bump commit re-triggered the PR's checks — https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}/checks"
              exit 0
            fi
            echo "no check run yet (attempt ${attempt}/24)"
            sleep 5
          done
          echo "::error::the auto-bump commit ${NEW_SHA} did not re-trigger the PR's checks within 120s — the push authenticated as GITHUB_TOKEN (or another credential), so GitHub started no workflow for it."
          echo "::error::Expected: a version-bump (release gate) check run on ${NEW_SHA} — https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}/checks"
          echo "::error::The bump is already on the PR head; fix RELEASE_PUSH_TOKEN (docs/RELEASING.md) and re-run this workflow."
          exit 1
