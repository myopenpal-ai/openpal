# Build the no-install Portable distribution on native runners, one per
# OS/arch (see docs/design/PORTABLE.md). Each matrix job runs the bundler's
# `portable` subcommand — which fetches the matching llama.cpp engine, builds
# the app via the Tauri CLI, assembles the bundle and archives it — then
# uploads the result.
#
# Per-merge cost controls (see the llama.cpp release-philosophy epic):
# - `prepare` resolves the llama.cpp engine tag once and computes the target
#   matrix from the tag kind: a `b*` nightly builds a slim canary subset
#   (default `ubuntu-vulkan-x64` + `win-vulkan-x64` — the targets with a
#   runner in this org today; overridable via the `NIGHTLY_CANARY_TARGETS`
#   repo variable), while `v*` and `workflow_dispatch` keep the full
#   five-target matrix.
# - Runner reality: `macos-x64` builds on the org's self-hosted
#   `macos-15-intel` runner; `macos-arm64` needs an Apple Silicon runner
#   registered with the `macos-14` label, which this org does not have yet —
#   that leg is cancelled until one is added (the `prepare` job emits a
#   warning naming it). Stable cuts stay failing until every target's runner
#   exists, by design.
# - the UI is compiled once per run (`ui` job → shared `ui-dist` artifact);
#   matrix jobs restore it and `tauri.portable.conf.json` disables the
#   per-target `beforeBuildCommand`.
# - the per-target engine download is cached keyed on target + the *resolved*
#   engine tag (from `prepare`), so repeat runs for the same tag hit the cache.
# - full verification concentrates at the stable cut: after `publish` signs
#   the artifacts and assembles the draft, a per-target `smoke` matrix boots
#   each bundle's metadata/engine and verifies the updater signature; a green
#   smoke makes `promote` issue the human promote instructions, a red smoke
#   makes `discard` delete the draft so nothing stale lingers.
#
# Triggers: manual (with optional pre-staged model), a `v*` stable tag, or a
# `b*` nightly tag.
name: portable

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Optional catalog model id to pre-stage (e.g. qwen3-4b-instruct-2507). Leave blank for Portable Lite."
        type: string
        default: ""
      accept_license:
        description: "Confirm compliance with a non-permissive model license (Llama/Gemma)."
        type: boolean
        default: false
  push:
    tags:
      - "v*"
      - "b*"

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

# Every job gets the Actions token as GH_TOKEN so the bundler's GitHub API
# calls (llama.cpp release lookups in `prepare`, the build jobs' engine fetch,
# `gh` in publish/smoke) authenticate instead of hitting the anonymous rate
# limit shared runner IPs exhaust (HTTP 403).
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # Compute what this run builds. One cheap job decides the matrix from the
  # tag kind (canary subset for `b*` nightlies, full five for `v*` and
  # workflow_dispatch) and resolves the llama.cpp engine tag once, so every
  # matrix job keys its engine cache on the same resolved tag.
  prepare:
    name: prepare matrix + engine tag
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      engine_tag: ${{ steps.engine.outputs.tag }}
      kind: ${{ steps.matrix.outputs.kind }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-prepare

      # Resolve "latest" → concrete build tag once, following llama.cpp's
      # nightly pointer release. The resolved tag (never the literal "latest")
      # is the cache key the matrix jobs below hit, so it must be resolved
      # exactly once, up front — resolving per-job would let the key drift.
      - name: Resolve llama.cpp engine tag
        id: engine
        run: |
          set -euo pipefail
          tag="$(cargo run -p openpal-bundler -- resolve-engine-tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved engine tag: $tag"

      - name: Compute target matrix
        id: matrix
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_CANARY: ${{ vars.NIGHTLY_CANARY_TARGETS }}
        run: |
          set -euo pipefail

          is_stable() {
            [ "$EVENT_NAME" = "workflow_dispatch" ] || [[ "$REF_NAME" == v* ]]
          }

          # target → runner label, kept honest against what this org has
          # registered (macos-x64 builds on the self-hosted macos-15-intel
          # runner; macos-arm64 is waiting on an Apple Silicon box).
          os_for() {
            case "$1" in
              macos-arm64) echo "macos-14" ;;
              macos-x64) echo "macos-15-intel" ;;
              win-vulkan-x64) echo "windows-latest" ;;
              ubuntu-vulkan-x64) echo "ubuntu-22.04" ;;
              ubuntu-vulkan-arm64) echo "ubuntu-24.04-arm" ;;
              *) return 1 ;;
            esac
          }

          # Runner inventory this workflow depends on: a leg whose label has
          # no runner registered in the org is cancelled by GitHub with a
          # cryptic "configuration … not supported", so `warn_if_unregistered`
          # turns that into an explicit annotation. Keep in sync when runners
          # are added/removed (mainly: register an Apple Silicon runner with
          # the `macos-14` label to unblock macos-arm64). Every label not
          # listed here is assumed registered.
          warn_if_unregistered() { # $1 = target, $2 = runner label
            case "$2" in
              macos-14) echo "::warning::target \"$1\" maps to runner \"$2\", which has no registered runner in this org — this leg will be cancelled (register a self-hosted runner with that label)" ;;
            esac
          }

          if is_stable; then
            kind="stable"
            targets="macos-arm64,macos-x64,win-vulkan-x64,ubuntu-vulkan-x64,ubuntu-vulkan-arm64"
          else
            # Canary default = the targets with a runner today; add
            # macos-arm64 back once a `macos-14` (Apple Silicon) runner exists.
            kind="canary"
            targets="${NIGHTLY_CANARY:-ubuntu-vulkan-x64,win-vulkan-x64}"
          fi

          entries=""
          IFS=,
          for t in $targets; do
            # Tolerate spaces/hanging commas in NIGHTLY_CANARY_TARGETS
            # (e.g. "ubuntu-vulkan-x64, win-vulkan-x64").
            t="${t//[[:space:]]/}"
            [ -n "$t" ] || continue
            os="$(os_for "$t")" || {
              echo "::error::unknown target \"$t\" (from NIGHTLY_CANARY_TARGETS) — known targets: macos-arm64, macos-x64, win-vulkan-x64, ubuntu-vulkan-x64, ubuntu-vulkan-arm64"
              exit 1
            }
            warn_if_unregistered "$t" "$os"
            crt=""
            [ "$t" = "win-vulkan-x64" ] && crt=',"crt_static":true'
            entries="${entries}{\"name\":\"$t\",\"os\":\"$os\",\"target\":\"$t\"$crt},"
          done
          unset IFS

          matrix="[${entries%,}]"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix [$kind]: $matrix"

  # The UI is byte-identical for every target — build it once per run and
  # hand `ui/dist` to every matrix job instead of compiling it five times.
  ui:
    name: build shared UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build the UI once
        run: npm --prefix ui run build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: [prepare, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-${{ matrix.target }}

      # Tauri 2 (WebKitGTK) + AppImage (FUSE) + cpal (ALSA) build/runtime deps.
      # libfuse2 is `libfuse2t64` on Ubuntu 24.04+ — try both.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            build-essential curl wget file
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      # Statically link the MSVC runtime into the app .exe so it runs on a clean
      # Windows (the engine's own MSVC redists are staged separately).
      - name: Enable crt-static (Windows)
        if: matrix.crt_static
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      # The Windows build vendors OpenSSL from source (rusqlite →
      # bundled-sqlcipher-vendored-openssl on non-Apple targets), which needs a
      # full perl + nasm; the windows-latest Git-Bash perl lacks the required
      # modules (IPC::Cmd / Params::Check) and OpenSSL's Configure dies.
      # Strawberry Perl provides a complete toolchain for openssl-src.
      - name: Install OpenSSL build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install --yes --no-progress strawberryperl
          choco install --yes --no-progress nasm
          # choco writes Strawberry to the machine PATH, which the already
          # running runner process never re-reads — and the bash build step
          # prepends Git's /usr/bin, so the broken MSYS2 perl would win anyway.
          # Prepending Strawberry's bin via GITHUB_PATH fixes every bare `perl`
          # call (openssl's build scripts use plain `perl`, not the full path),
          # and the explicit PERL var is what openssl-src itself consults
          # (OPENSSL_SRC_PERL → PERL), so the vendored build uses it no matter
          # what PATH says.
          printf '%s\n' 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
          printf '%s\n' 'PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

      # Fixed-version WebView2 runtime so the Windows build launches with no
      # system install. The cab URL is volatile (version + arch specific), so it
      # lives in a repo variable a maintainer pins for releases; without it the
      # zip still assembles (the bundler warns it won't launch until a runtime is
      # dropped in webview2-runtime/).
      - name: Stage fixed WebView2 runtime (Windows)
        if: runner.os == 'Windows' && vars.WEBVIEW2_FIXED_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "${{ vars.WEBVIEW2_FIXED_URL }}" -o webview2.cab
          mkdir -p webview2-fixed
          expand webview2.cab -F:* webview2-fixed >/dev/null
          exe=$(find webview2-fixed -iname msedgewebview2.exe | head -1)
          if [ -z "$exe" ]; then echo "msedgewebview2.exe not found in cab"; exit 1; fi
          echo "WEBVIEW2_DIR=$(dirname "$exe")" >> "$GITHUB_ENV"

      # Engine cache: keyed on the target plus the tag `prepare` resolved. A hit
      # hands this job a fully-staged engine (its engine-version.json matches the
      # target), so the bundler's own "already staged for this target" fast path
      # skips the GB-scale download; an engine bump is a deliberate one-time miss.
      - name: Restore engine cache (per target + resolved tag)
        uses: actions/cache@v4
        with:
          path: crates/app/resources/llama
          key: portable-engine-${{ matrix.target }}-${{ needs.prepare.outputs.engine_tag }}

      # The UI was built once in the `ui` job; drop its `dist/` in place so the
      # Tauri build finds it and skips its own beforeBuildCommand entirely.
      - name: Restore shared UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: target/ui-dist

      - name: Place ui/dist
        shell: bash
        run: |
          set -euo pipefail
          if [ -d target/ui-dist/dist ]; then
            mv target/ui-dist/dist ui/dist
          else
            mkdir -p ui/dist
            mv target/ui-dist/* ui/dist/
          fi

      - name: Install npm dependencies (root — for the Tauri CLI)
        run: npm ci

      # Inputs are passed through the environment (not interpolated into the
      # script body) so a crafted dispatch input can't inject shell commands.
      # The engine tag comes from `prepare` (never re-resolved here), so the
      # bundle matches the engine cache key exactly.
      - name: Build Portable distribution
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          ACCEPT_LICENSE: ${{ inputs.accept_license }}
          TARGET: ${{ matrix.target }}
          ENGINE_TAG: ${{ needs.prepare.outputs.engine_tag }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ -n "${MODEL:-}" ]; then FLAGS="$FLAGS --model $MODEL"; fi
          if [ "${ACCEPT_LICENSE:-}" = "true" ]; then FLAGS="$FLAGS --accept-license"; fi
          if [ -n "${WEBVIEW2_DIR:-}" ]; then FLAGS="$FLAGS --webview2 $WEBVIEW2_DIR"; fi
          echo "Running: portable --target $TARGET --engine-tag $ENGINE_TAG $FLAGS"
          # shellcheck disable=SC2086 # $FLAGS is an intentional word-splitting list of optional flags
          cargo run -p openpal-bundler -- portable --target "$TARGET" --engine-tag "$ENGINE_TAG" $FLAGS

      # Sanity-check the AppImage is well-formed (extractable). The engine itself
      # is smoke-tested inside the bundler's fetch step when the host can run it.
      - name: Verify AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          img="$(find target/portable -maxdepth 1 -name '*.AppImage' 2>/dev/null | head -1)" || true
          if [ -n "${img:-}" ]; then
            "$img" --appimage-extract >/dev/null && echo "AppImage OK: $img"
            rm -rf squashfs-root
          else
            echo "No bare .AppImage (model bundle ships a .tar.gz instead) — skipping."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPal-portable-${{ matrix.target }}
          path: |
            target/portable/OpenPal-portable-*.zip
            target/portable/OpenPal-portable-*.AppImage
            target/portable/OpenPal-portable-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Only on a real `v*` tag push (never workflow_dispatch, which may build a
  # one-off with a pre-staged model that shouldn't become "the" release for
  # that tag; nightlies keep their own pre-release path) — signs every Portable
  # artifact the matrix produced, merges them into the tag's `latest.json` (see
  # bundler/src/manifest.rs), and publishes/updates the GitHub Release. A
  # release created here is a draft: OpenPal's updater endpoint reads
  # `/releases/latest`, which never resolves to a draft, so this stays inert
  # until a human promotes it — the deliberate soft-launch gate. The promote
  # instructions themselves are issued by the `promote` job only after the
  # per-target smoke gate passes.
  publish:
    name: publish
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Install npm dependencies (root — for the Tauri CLI signer)
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: OpenPal-portable-*
          path: target/portable-artifacts
          merge-multiple: true

      - name: Publish signed manifest + release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo run -p openpal-bundler -- manifest \
            --tag "${{ github.ref_name }}" \
            --portable-dir target/portable-artifacts

      - name: Draft assembled summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Draft release ${{ github.ref_name }} assembled

          Artifacts signed with the updater key and uploaded; `latest.json`
          merged. Inert until a human promotes — the per-target smoke gate
          runs next and decides whether this draft survives.
          EOF

  # After the draft is signed and assembled, boot each bundle and verify it:
  # the artifact's SHA-256 and updater signature (against latest.json from the
  # draft), the version it reports, and that the packaged engine executes. One
  # matrix leg per target, on the target's own OS. Runs only on the stable cut
  # (a nightly's canary set deliberately skips full verification).
  smoke:
    name: smoke (${{ matrix.name }})
    needs: [prepare, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-smoke-${{ matrix.target }}

      # Download the shipped bytes from the draft release (not the workflow
      # artifacts) so this verifies exactly what a user would download, plus
      # the manifest that carries the per-target signature and SHA-256.
      - name: Download bundle + manifest from the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/smoke
          gh release download "${{ github.ref_name }}" --repo myopenpal-ai/openpal \
            -p "OpenPal-portable-${{ matrix.target }}.*" \
            -p latest.json \
            -D target/smoke

      - name: Smoke-test the bundle
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          artifact="$(find target/smoke -maxdepth 1 -name 'OpenPal-portable-${{ matrix.target }}.*' 2>/dev/null | head -1)"
          if [ -z "$artifact" ]; then
            echo "no bundle artifact found in target/smoke for ${{ matrix.target }}"; exit 1
          fi
          cargo run -p openpal-bundler -- smoke \
            --target "${{ matrix.target }}" \
            --artifact "$artifact" \
            --manifest target/smoke/latest.json \
            --tag "${{ github.ref_name }}"

  # Only when every smoke leg passed: tell the human to promote. This is the
  # only place the promote instruction is emitted — the soft-launch gate stays
  # a human, deliberate action (`/releases/latest` never resolves to a draft).
  promote:
    name: promote (summary)
    needs: [publish, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Promote instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ✓ Smoke passed — promote ${{ github.ref_name }}

          Every target in the stable matrix passed the per-target smoke gate:
          each bundle reports **${{ github.ref_name }}** (semver core), the
          packaged engine executes, and each artifact's updater signature
          verified against the configured public key.

          To promote (make it visible to `/releases/latest`, and therefore to
          users' in-app updater):

          `gh release edit ${{ github.ref_name }} --draft=false --repo myopenpal-ai/openpal`
          EOF

  # A failing smoke must not leave a half-verified draft around, and must not
  # emit promote instructions: delete the draft and say why. (A guard in the
  # if makes this a no-op unless the release itself never existed.)
  discard:
    name: discard draft (smoke failed)
    needs: [publish, smoke]
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (needs.smoke.result == 'failure' || needs.smoke.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" --repo myopenpal-ai/openpal >/dev/null 2>&1; then
            gh release delete "${{ github.ref_name }}" --repo myopenpal-ai/openpal --yes
          else
            echo "No release exists for ${{ github.ref_name }} — nothing to delete."
          fi

      - name: Note the failure
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ❌ Smoke failed — draft ${{ github.ref_name }} discarded

          One or more per-target smoke legs failed (see the `smoke` matrix job
          above), so the draft release was deleted and **no promote
          instructions were issued**. Fix the build and re-cut the release.
          EOF
