# Build the no-install Portable distribution on native runners, one per
# OS/arch (see docs/design/PORTABLE.md). Each job runs the bundler's `portable`
# subcommand — which fetches the matching llama.cpp engine, builds the app via
# the Tauri CLI, assembles the bundle and archives it — then uploads the result.
#
# Triggers: manual (with optional pre-staged model) and on a `v*` tag.
name: portable

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Optional catalog model id to pre-stage (e.g. qwen3-4b-instruct-2507). Leave blank for Portable Lite."
        type: string
        default: ""
      accept_license:
        description: "Confirm compliance with a non-permissive model license (Llama/Gemma)."
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, target: macos-arm64 }
          - { name: macos-x64, os: macos-13, target: macos-x64 }
          - { name: win-x64, os: windows-latest, target: win-vulkan-x64, crt_static: true }
          - { name: linux-x64, os: ubuntu-22.04, target: ubuntu-vulkan-x64 }
          # Engine arm64 prebuilt has a higher glibc floor (~2.39) → build on 24.04-arm.
          # NOTE: hosted arm64 Linux runners are free only for PUBLIC repos; on a
          # PRIVATE repo this leg needs a Team/Enterprise plan or a self-hosted
          # arm64 runner, else the job queues with no runner. fail-fast:false keeps
          # the other targets building. Drop this entry if arm64 isn't entitled.
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: ubuntu-vulkan-arm64 }
          # Windows on ARM is CPU-only and needs an aarch64-pc-windows-msvc cross
          # toolchain + arm64 WebView2; left out of CI until a cross path is set up.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-${{ matrix.target }}

      # Tauri 2 (WebKitGTK) + AppImage (FUSE) + cpal (ALSA) build/runtime deps.
      # libfuse2 is `libfuse2t64` on Ubuntu 24.04+ — try both.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            build-essential curl wget file
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      # Statically link the MSVC runtime into the app .exe so it runs on a clean
      # Windows (the engine's own MSVC redists are staged separately).
      - name: Enable crt-static (Windows)
        if: matrix.crt_static
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      # Fixed-version WebView2 runtime so the Windows build launches with no
      # system install. The cab URL is volatile (version + arch specific), so it
      # lives in a repo variable a maintainer pins for releases; without it the
      # zip still assembles (the bundler warns it won't launch until a runtime is
      # dropped in webview2-runtime/).
      - name: Stage fixed WebView2 runtime (Windows)
        if: runner.os == 'Windows' && vars.WEBVIEW2_FIXED_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "${{ vars.WEBVIEW2_FIXED_URL }}" -o webview2.cab
          mkdir -p webview2-fixed
          expand webview2.cab -F:* webview2-fixed >/dev/null
          exe=$(find webview2-fixed -iname msedgewebview2.exe | head -1)
          if [ -z "$exe" ]; then echo "msedgewebview2.exe not found in cab"; exit 1; fi
          echo "WEBVIEW2_DIR=$(dirname "$exe")" >> "$GITHUB_ENV"

      - name: Install npm dependencies (root + ui)
        run: |
          npm ci
          npm --prefix ui ci

      # Inputs are passed through the environment (not interpolated into the
      # script body) so a crafted dispatch input can't inject shell commands.
      - name: Build Portable distribution
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          ACCEPT_LICENSE: ${{ inputs.accept_license }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ -n "${MODEL:-}" ]; then FLAGS="$FLAGS --model $MODEL"; fi
          if [ "${ACCEPT_LICENSE:-}" = "true" ]; then FLAGS="$FLAGS --accept-license"; fi
          if [ -n "${WEBVIEW2_DIR:-}" ]; then FLAGS="$FLAGS --webview2 $WEBVIEW2_DIR"; fi
          echo "Running: portable --target $TARGET $FLAGS"
          cargo run -p openpal-bundler -- portable --target "$TARGET" $FLAGS

      # Sanity-check the AppImage is well-formed (extractable). The engine itself
      # is smoke-tested inside the bundler's fetch step when the host can run it.
      - name: Verify AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          img=$(ls target/portable/*.AppImage 2>/dev/null | head -1) || true
          if [ -n "${img:-}" ]; then
            "$img" --appimage-extract >/dev/null && echo "AppImage OK: $img"
            rm -rf squashfs-root
          else
            echo "No bare .AppImage (model bundle ships a .tar.gz instead) — skipping."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPal-portable-${{ matrix.target }}
          path: |
            target/portable/OpenPal-portable-*.zip
            target/portable/OpenPal-portable-*.AppImage
            target/portable/OpenPal-portable-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Only on a real `v*` tag push (never workflow_dispatch, which may build a
  # one-off with a pre-staged model that shouldn't become "the" release for
  # that tag) — signs every Portable artifact the matrix produced, merges
  # them into the tag's `latest.json` (see bundler/src/manifest.rs), and
  # publishes/updates the GitHub Release. A release created here is a draft:
  # OpenPal's updater endpoint reads `/releases/latest`, which never
  # resolves to a draft, so this stays inert until a human promotes it
  # (`gh release edit <tag> --draft=false`) — the deliberate soft-launch
  # gate from the auto-updater plan.
  publish:
    name: publish
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Install npm dependencies (root — for the Tauri CLI signer)
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: OpenPal-portable-*
          path: target/portable-artifacts
          merge-multiple: true

      - name: Publish signed manifest + release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo run -p openpal-bundler -- manifest \
            --tag "${{ github.ref_name }}" \
            --portable-dir target/portable-artifacts
