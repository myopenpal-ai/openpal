# Real-model prompt-injection detector test
# (crates/core/tests/prompt_injection_corpus.rs, --ignored by default):
# downloads the pinned ~300MB classifier from Hugging Face and runs it over the
# documented benign / injection sample sets in
# crates/core/tests/fixtures/prompt_injection/, plus one known payload per
# route into the model. Network-dependent and CPU-heavy, so it's
# path-filtered to what it exercises: the detector, its fixture, the
# dependency lockfile (a tract/tokenizers bump can move the scores), and this
# file.
name: injection-e2e

on:
  pull_request:
    paths:
      - "crates/core/src/injection/**"
      - "crates/core/tests/prompt_injection_corpus.rs"
      - "crates/core/tests/fixtures/prompt_injection/**"
      - "Cargo.lock"
      - ".github/workflows/injection-e2e.yml"
  push:
    branches: [main]
    paths:
      - "crates/core/src/injection/**"
      - "crates/core/tests/prompt_injection_corpus.rs"
      - "crates/core/tests/fixtures/prompt_injection/**"
      - "Cargo.lock"

concurrency:
  group: injection-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  injection-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: injection-e2e

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            build-essential

      # Keyed by the pinned ONNX file's sha256 (crates/core/src/injection/
      # model.rs), so a re-pin downloads the new files instead of reusing
      # stale ones.
      - name: Cache the pinned classifier
        uses: actions/cache@v4
        with:
          path: /tmp/openpal-test-models/prompt-guard
          key: injection-e2e-model-61cd0741cdbfcc22

      - name: Run the real-model detector tests
        run: cargo test -p openpal-core --test prompt_injection_corpus -- --ignored --nocapture --test-threads 1
