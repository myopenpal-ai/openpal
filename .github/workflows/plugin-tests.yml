# Python plugin unit/integration suite (plugins/speech). Path-filtered: these
# tests never touch the Rust/frontend build, so there's no reason to run them
# on every PR, only when the plugin's own code changes.
#
# plugins/web-search/ no longer has a Python test suite: its agentic search
# loop was retired in favor of a native Rust tool-use loop (see
# crates/core/src/agent/builtin/websearch.rs), covered by the `rust` job
# instead. The plugin's only remaining Python is service.py/setup_plugin.py
# (the managed local SearXNG launcher), which was already untested here even
# before that change — see the note below.
#
# Deliberately does NOT run setup_plugin.py (which downloads Piper binaries /
# a real Whisper model — no test needs any of that).
name: plugin-tests

# The pull_request trigger deliberately has NO workflow-level `paths`
# filter: a required check whose workflow is skipped by path filtering stays
# "Expected"/Pending and blocks merging (GitHub docs: "Avoid requiring
# workflows that can be skipped"). Instead the workflow always runs and the
# heavy `speech` job below is skipped by a job-level condition when the
# plugin's paths didn't change — a skipped job reports success, so the
# required check is always satisfied without taxing unrelated PRs.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "plugins/speech/**"
      - ".github/workflows/plugin-tests.yml"

concurrency:
  group: plugin-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight always-run gate: decides whether `speech` needs to run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      speech: ${{ steps.filter.outputs.speech }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            speech:
              - "plugins/speech/**"
              - ".github/workflows/plugin-tests.yml"

  speech:
    needs: changes
    if: needs.changes.outputs.speech == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/speech/requirements.txt
      - name: Install dependencies
        working-directory: plugins/speech
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run tests
        working-directory: plugins/speech
        run: python -m pytest -q --cov=openpal_speech --cov=setup_plugin --cov-report=term-missing
