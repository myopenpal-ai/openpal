[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/sync-protocol", "crates/relay", "bundler"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["myopenpal.ai"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
tracing = "0.1"
base64 = "0.22"
regex = "1"
axum = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The prompt-injection classifier (`openpal_core::injection`) runs these on
# every scan. Unoptimized they're roughly 10x slower — seconds per page in a
# debug build of the app, and minutes for the real-model corpus test — so
# they're optimized in dev (and test) builds too, while the app's own code
# stays debuggable. Their debug info is dropped as well: it's gigabytes for
# tract's generic-heavy crates, and it pushed CI's Linux runner out of disk
# space while linking the test binaries.
[profile.dev.package.tract-core]
opt-level = 3
debug = false
[profile.dev.package.tract-data]
opt-level = 3
debug = false
[profile.dev.package.tract-extra]
opt-level = 3
debug = false
[profile.dev.package.tract-hir]
opt-level = 3
debug = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug = false
[profile.dev.package.tract-nnef]
opt-level = 3
debug = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug = false
[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug = false
[profile.dev.package.tract-transformers]
opt-level = 3
debug = false
[profile.dev.package.tokenizers]
opt-level = 3
debug = false
