[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/sync-protocol", "crates/relay", "bundler"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["myopenpal.ai"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
tracing = "0.1"
base64 = "0.22"
regex = "1"
axum = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
